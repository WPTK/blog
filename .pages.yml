media:
  input: images
  output: /images

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    exclude:
      - .gitkeep
    filename: "{year}-{month}-{day}-{fields.title}.md"
    view:
      fields:
        - title
        - date
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        time: true
        format: "yyyy-MM-dd HH:mm"
        required: true
      - name: description
        label: Description
        type: text
        description: One line for search results and link previews.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: published
        label: Published
        type: boolean
        description: Turn off to hide the post from the site.
        default: true
      - name: body
        label: Body
        type: rich-text
