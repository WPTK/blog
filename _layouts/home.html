---
layout: default
---
<h1>Posts</h1>
{%- if site.posts.size > 0 %}
<ul class="post-list">
  {%- for post in site.posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
    <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
  </li>
  {%- endfor %}
</ul>
{%- else %}
<p>Nothing here yet.</p>
{%- endif %}
