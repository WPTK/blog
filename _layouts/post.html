---
layout: default
---
<article>
  <h1>{{ page.title | escape }}</h1>
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <div class="prose">
{{ content }}
  </div>
  <div class="post-foot">
    <span>{% if page.tags and page.tags.size > 0 %}Tagged {{ page.tags | join: ", " }}{% endif %}</span>
    <a href="{{ '/' | relative_url }}">&larr; All posts</a>
  </div>
</article>
