---
layout: default
title: Tags
permalink: /tags/
---
<h1>Tags</h1>
<ul class="tag-index">
{%- assign sorted_tags = site.tags | sort %}
{%- for tag in sorted_tags %}
  <li><a href="{{ '/tags/' | relative_url }}{{ tag[0] | slugify }}/">{{ tag[0] | escape }}</a> <span class="tag-count">{{ tag[1].size }}</span></li>
{%- endfor %}
</ul>
